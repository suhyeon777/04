<!DOCTYPE html>
<html lang="ko" style="height: 100%;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 100%;
        }

        /* 헤더 */
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .header-content {
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .header-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        .header-title {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .header-title h1 {
            font-size: 20px;
            color: #333;
            font-weight: 600;
        }

        .header-title p {
            font-size: 12px;
            color: #999;
        }

        /* 메인 콘텐츠 */
        .main-content {
            flex: 1;
            display: flex;
            overflow: hidden;
            padding: 20px;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        /* 좌측 사이드바 (선택사항) */
        .sidebar {
            display: none;
            width: 280px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
        }

        .sidebar h3 {
            font-size: 14px;
            color: #667eea;
            text-transform: uppercase;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .sidebar-item {
            padding: 10px 12px;
            margin-bottom: 8px;
            background: #f5f5f5;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            color: #666;
            transition: all 0.2s;
        }

        .sidebar-item:hover {
            background: #667eea;
            color: white;
            transform: translateX(4px);
        }

        /* 챗봇 iframe */
        .chat-container {
            flex: 1;
            display: flex;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            background: white;
            min-width: 0;
        }

        .chat-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 반응형 디자인 */
        @media (max-width: 768px) {
            .main-content {
                padding: 12px;
                gap: 12px;
            }

            .header {
                padding: 16px;
            }

            .header-title h1 {
                font-size: 18px;
            }

            .header-icon {
                width: 36px;
                height: 36px;
                font-size: 18px;
            }
        }

        @media (max-width: 480px) {
            .header-content {
                flex-direction: column;
                text-align: center;
            }

            .header-title {
                align-items: center;
            }

            .main-content {
                padding: 8px;
            }
        }

        /* 스크롤바 스타일 */
        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .sidebar::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 헤더 -->
        <div class="header">
            <div class="header-content">
                <div class="header-icon">🤖</div>
                <div class="header-title">
                    <h1>AI Assistant</h1>
                    <p>Online • Always ready to help</p>
                </div>
            </div>
        </div>

        <!-- 메인 콘텐츠 -->
        <div class="main-content">
            <!-- 사이드바 (필요시 display: flex로 변경) -->
            <div class="sidebar">
                <h3>Quick Links</h3>
                <div class="sidebar-item">💬 New Chat</div>
                <div class="sidebar-item">📋 History</div>
                <div class="sidebar-item">⭐ Favorites</div>
                <div class="sidebar-item">⚙️ Settings</div>
            </div>

            <!-- 챗봇 -->
            <div class="chat-container">
                <iframe src="https://copilotstudio.microsoft.com/environments/9324e73a-cd4e-e049-b7ba-177af6165e9c/bots/crbf2_ai_jt4HVI/webchat?__version__=2&enableFileAttachment=false&cliAgent=true" frameborder="0"></iframe>
            </div>
        </div>
    </div>
</body>
</html>
